<svg xmlns="http://www.w3.org/2000/svg" width="1640" height="1700" viewBox="0 0 1640 1700" role="img" aria-labelledby="svg-title svg-desc">
  <title id="svg-title">SkyTab merchant lifecycle</title>
  <desc id="svg-desc">Four-stage SkyTab onboarding lifecycle from Activate to Configure to Operate to Optimize, including merchant goals, what merchants see, SkyTab guidance, and key transition examples.</desc>
  <defs>
    <filter id="shadow" x="-5%" y="-10%" width="110%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="9" flood-color="#172554" flood-opacity="0.06"/>
    </filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 z" fill="#607089"/>
    </marker>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 z" fill="#2D65B5"/>
    </marker>
    <style>
      text { font-family: Outfit, Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .stage-number { font-size: 15px; font-weight: 600; letter-spacing: 1.6px; }
      .stage-name { font-size: 32px; font-weight: 600; fill: #172033; }
      .section-label { font-size: 15px; font-weight: 600; letter-spacing: 1.3px; fill: #667287; }
      .goal { font-size: 22px; font-weight: 500; fill: #172033; }
      .body { font-size: 20px; font-weight: 400; fill: #354155; }
      .assistant { font-size: 20px; font-weight: 500; fill: #21304A; }
      .transition { font-size: 18px; font-weight: 500; fill: #43536A; }
      .return-label { font-size: 19px; font-weight: 500; fill: #43536A; }
    </style>
  </defs>

  <rect width="1640" height="1700" rx="32" fill="#F4F7FB"/>
  <g transform="translate(20 0)">

  <!-- Activate -->
  <g transform="translate(0 24)">
  <g filter="url(#shadow)">
    <rect x="44" y="44" width="1512" height="250" rx="22" fill="#FFFFFF" stroke="#D9E4F2" stroke-opacity="0.8"/>
    <path d="M68 44 H390 V294 H68 Q44 294 44 270 V68 Q44 44 68 44Z" fill="#EEF5FF"/>
  </g>
  <text class="stage-number" x="76" y="84" fill="#4F86D6">STAGE 01</text>
  <text class="stage-name" x="76" y="145">Activate</text>
  <text class="section-label" x="76" y="190">MERCHANT GOAL</text>
  <text class="goal" x="76" y="226"><tspan x="76">Get ready to take the</tspan><tspan x="76" dy="31">first payment</tspan></text>
  <line x1="420" y1="72" x2="420" y2="266" stroke="#E2E7EF"/>
  <text class="section-label" x="454" y="92">WHAT MERCHANTS SEE</text>
  <g class="body">
    <circle cx="462" cy="134" r="4" fill="#6A9FEF"/><text x="478" y="141">Launch checklist</text>
    <circle cx="462" cy="174" r="4" fill="#6A9FEF"/><text x="478" y="181">Account, compliance and risk status</text>
    <circle cx="462" cy="214" r="4" fill="#6A9FEF"/><text x="478" y="221">Hardware delivery and installation</text>
    <circle cx="462" cy="254" r="4" fill="#6A9FEF"/><text x="478" y="261">Payments readiness · CSM and support</text>
  </g>
  <line x1="1058" y1="72" x2="1058" y2="266" stroke="#E2E7EF"/>
  <rect x="1088" y="72" width="438" height="194" rx="18" fill="#F3F7FE" stroke="#DCE7F4"/>
  <text class="section-label" x="1118" y="108">SKYTAB GUIDANCE</text>
  <text class="assistant" x="1118" y="151"><tspan x="1118">Clarify the critical path</tspan><tspan x="1118" dy="38">Explain requirements</tspan><tspan x="1118" dy="38">Guide the next best action</tspan></text>
  </g>

  <!-- Transition 1 -->
  <g transform="translate(0 48)">
  <path d="M800 298 V378" fill="none" stroke="#607089" stroke-width="2" marker-end="url(#arrow)"/>
  <text class="transition" x="850" y="343">Launch blockers cleared + first payment ready</text>
  </g>

  <!-- Configure -->
  <g transform="translate(0 72)">
  <g filter="url(#shadow)">
    <rect x="44" y="386" width="1512" height="250" rx="22" fill="#FFFFFF" stroke="#D9E4F2" stroke-opacity="0.8"/>
    <path d="M68 386 H390 V636 H68 Q44 636 44 612 V410 Q44 386 68 386Z" fill="#E7F0FC"/>
  </g>
  <text class="stage-number" x="76" y="426" fill="#3E74C7">STAGE 02</text>
  <text class="stage-name" x="76" y="487">Configure</text>
  <text class="section-label" x="76" y="532">MERCHANT GOAL</text>
  <text class="goal" x="76" y="568"><tspan x="76">Tailor SkyTab to how</tspan><tspan x="76" dy="31">the business runs</tspan></text>
  <line x1="420" y1="414" x2="420" y2="608" stroke="#E2E7EF"/>
  <text class="section-label" x="454" y="434">WHAT MERCHANTS SEE</text>
  <g class="body">
    <circle cx="462" cy="476" r="4" fill="#4F82D4"/><text x="478" y="483">Menu and catalog status</text>
    <circle cx="462" cy="516" r="4" fill="#4F82D4"/><text x="478" y="523">Staff roles and permissions</text>
    <circle cx="462" cy="556" r="4" fill="#4F82D4"/><text x="478" y="563">Locations, devices and preferences</text>
    <circle cx="462" cy="596" r="4" fill="#4F82D4"/><text x="478" y="603">Tutorials and contextual recommendations</text>
  </g>
  <line x1="1058" y1="414" x2="1058" y2="608" stroke="#E2E7EF"/>
  <rect x="1088" y="414" width="438" height="194" rx="18" fill="#EDF4FD" stroke="#DCE7F4"/>
  <text class="section-label" x="1118" y="450">SKYTAB GUIDANCE</text>
  <text class="assistant" x="1118" y="493"><tspan x="1118">Teach in context</tspan><tspan x="1118" dy="38">Sequence setup</tspan><tspan x="1118" dy="38">Confirm readiness</tspan></text>
  </g>

  <!-- Transition 2 -->
  <g transform="translate(0 96)">
  <path d="M800 640 V720" fill="none" stroke="#607089" stroke-width="2" marker-end="url(#arrow)"/>
  <text class="transition" x="850" y="685">Core setup complete + business goes live</text>
  </g>

  <!-- Operate -->
  <g transform="translate(0 120)">
  <g filter="url(#shadow)">
    <rect x="44" y="728" width="1512" height="250" rx="22" fill="#FFFFFF" stroke="#D9E4F2" stroke-opacity="0.8"/>
    <path d="M68 728 H390 V978 H68 Q44 978 44 954 V752 Q44 728 68 728Z" fill="#DCE8F8"/>
  </g>
  <text class="stage-number" x="76" y="768" fill="#275AA7">STAGE 03</text>
  <text class="stage-name" x="76" y="829">Operate</text>
  <text class="section-label" x="76" y="874">MERCHANT GOAL</text>
  <text class="goal" x="76" y="910"><tspan x="76">Run service confidently</tspan><tspan x="76" dy="31">and resolve exceptions</tspan></text>
  <line x1="420" y1="756" x2="420" y2="950" stroke="#E2E7EF"/>
  <text class="section-label" x="454" y="776">WHAT MERCHANTS SEE</text>
  <g class="body">
    <circle cx="462" cy="818" r="4" fill="#3268B8"/><text x="478" y="825">Payments and orders</text>
    <circle cx="462" cy="858" r="4" fill="#3268B8"/><text x="478" y="865">Account and system health</text>
    <circle cx="462" cy="898" r="4" fill="#3268B8"/><text x="478" y="905">Exceptions needing attention</text>
    <circle cx="462" cy="938" r="4" fill="#3268B8"/><text x="478" y="945">Support cases · Service and release alerts</text>
  </g>
  <line x1="1058" y1="756" x2="1058" y2="950" stroke="#E2E7EF"/>
  <rect x="1088" y="756" width="438" height="194" rx="18" fill="#E7F0FA" stroke="#D7E3F2"/>
  <text class="section-label" x="1118" y="792">SKYTAB GUIDANCE</text>
  <text class="assistant" x="1118" y="835"><tspan x="1118">Surface operational status</tspan><tspan x="1118" dy="38">Make exceptions actionable</tspan><tspan x="1118" dy="38">Direct help when needed</tspan></text>
  </g>

  <!-- Transition 3 -->
  <g transform="translate(0 144)">
  <path d="M800 982 V1062" fill="none" stroke="#607089" stroke-width="2" marker-end="url(#arrow)"/>
  <text class="transition" x="850" y="1027">Operations stabilize + enough data accrues</text>
  </g>

  <!-- Optimize -->
  <g transform="translate(0 168)">
  <g filter="url(#shadow)">
    <rect x="44" y="1070" width="1512" height="250" rx="22" fill="#FFFFFF" stroke="#D9E4F2" stroke-opacity="0.8"/>
    <path d="M68 1070 H390 V1320 H68 Q44 1320 44 1296 V1094 Q44 1070 68 1070Z" fill="#D2E1F4"/>
  </g>
  <text class="stage-number" x="76" y="1110" fill="#1E4E92">STAGE 04</text>
  <text class="stage-name" x="76" y="1171">Optimize</text>
  <text class="section-label" x="76" y="1216">MERCHANT GOAL</text>
  <text class="goal" x="76" y="1252"><tspan x="76">Improve performance and</tspan><tspan x="76" dy="31">get more value from SkyTab</tspan></text>
  <line x1="420" y1="1098" x2="420" y2="1292" stroke="#E2E7EF"/>
  <text class="section-label" x="454" y="1118">WHAT MERCHANTS SEE</text>
  <g class="body">
    <circle cx="462" cy="1160" r="4" fill="#1E4E92"/><text x="478" y="1167">Performance insights and trends</text>
    <circle cx="462" cy="1200" r="4" fill="#1E4E92"/><text x="478" y="1207">Opportunities and growth recommendations</text>
    <circle cx="462" cy="1240" r="4" fill="#1E4E92"/><text x="478" y="1247">Relevant feature discovery</text>
    <circle cx="462" cy="1280" r="4" fill="#1E4E92"/><text x="478" y="1287">Adoption and outcome signals</text>
  </g>
  <line x1="1058" y1="1098" x2="1058" y2="1292" stroke="#E2E7EF"/>
  <rect x="1088" y="1098" width="438" height="194" rx="18" fill="#E2ECF8" stroke="#D1DFEF"/>
  <text class="section-label" x="1118" y="1134">SKYTAB GUIDANCE</text>
  <text class="assistant" x="1118" y="1177"><tspan x="1118">Surface useful patterns</tspan><tspan x="1118" dy="38">Recommend next capabilities</tspan><tspan x="1118" dy="38">Connect insight to action</tspan></text>
  </g>

  <!-- State-aware return paths -->
  <g transform="translate(0 210)">
  <path d="M800 1324 V1388" fill="none" stroke="#4F82D4" stroke-width="2" stroke-dasharray="7 8"/>
  <path d="M800 1388 H480" fill="none" stroke="#4F82D4" stroke-width="2" stroke-dasharray="7 8" marker-end="url(#arrow-blue)"/>
  <rect x="110" y="1362" width="340" height="52" rx="26" fill="#FFFFFF" stroke="#D4DFEC"/>
  <text class="return-label" x="280" y="1395" text-anchor="middle">New location or feature → Configure</text>
  <path d="M800 1388 H1122" fill="none" stroke="#4F82D4" stroke-width="2" stroke-dasharray="7 8" marker-end="url(#arrow-blue)"/>
  <rect x="1152" y="1362" width="328" height="52" rx="26" fill="#FFFFFF" stroke="#D4DFEC"/>
  <text class="return-label" x="1316" y="1395" text-anchor="middle">Urgent exception → Operate</text>
  </g>
  </g>
</svg>
